name: Build Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[build]"

      - name: Build package
        shell: powershell
        run: ./build-windows.ps1

      - name: Verify executable
        shell: powershell
        run: ./dist/Snatcher.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: Snatcher-Windows-x64
          path: release/Snatcher-Windows-x64.zip

      - name: Attach package to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/Snatcher-Windows-x64.zip
